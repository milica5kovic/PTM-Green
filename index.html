                    const hours = current.getHours().toString().padStart(2, '0');
                    const minutes = current.getMinutes().toString().padStart(2, '0');
                    slots.push(`${hours}:${minutes}`);

                    alert("❌ Error saving booking. Please try again.");
                }
            };

            const isSlotBooked = (teacherId, timeSlot) => bookings.some(b => b.teacherId === teacherId && b.timeSlot === timeSlot);
            const isParentBusy = (email, timeSlot) => bookings.some(b => b.parentEmail === email && b.timeSlot === timeSlot);
            const hasParentBookedTeacher = (email, teacherId) => bookings.some(b => b.parentEmail === email && b.teacherId === teacherId);

            const getValidSlotsForParent = (parentEmail, teacherId) => {
                const parentSlots = bookings
                    .filter(b => b.parentEmail === parentEmail)
                    .map(b => timeSlots.indexOf(b.timeSlot))
                    .sort((a, b) => a - b);

                const teacherBookedSlots = bookings
                    .filter(b => b.teacherId === teacherId)
                    .map(b => b.timeSlot);

                // Ako roditelj nema nijedan termin — sve je dozvoljeno
                if (parentSlots.length === 0) {
                    return timeSlots.filter(slot => !teacherBookedSlots.includes(slot));
                }

                const validSlots = [];
                const minSlot = Math.min(...parentSlots);
                const maxSlot = Math.max(...parentSlots);

                timeSlots.forEach((slot, index) => {
                    // Preskoči ako je nastavnik već zauzet
                    if (teacherBookedSlots.includes(slot)) return;

                    // Preskoči ako roditelj već ima ovaj termin
                    if (parentSlots.includes(index)) return;



                    const expandsStart = (index === minSlot - 1);
                    const expandsEnd = (index === maxSlot + 1);

                    // Proveri da li popunjava rupu
                    let fillsGap = false;
                    for (let i = 1; i < parentSlots.length; i++) {
                        if (index > parentSlots[i - 1] && index < parentSlots[i]) {
                            fillsGap = true;
                            break;
                        }
                    }

                    if (expandsStart || expandsEnd || fillsGap) {
                        validSlots.push(slot);
                    }
                });

                return validSlots;
            };

            const getEarliestAvailableSlot = (teacherId) => {
                const teacherBookedSlots = bookings
                    .filter(b => b.teacherId === teacherId)
                    .map(b => b.timeSlot);

                for (let slot of timeSlots) {
                    if (!teacherBookedSlots.includes(slot)) {
                        return slot;
                    }
                }
                return null; // All slots booked
            };

            const validateEmail = (email) => {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            };

            const handleBooking = (timeSlot) => {
                const trimmedName = parentName.trim();
                const trimmedEmail = parentEmail.trim().toLowerCase();
                const trimmedStudent = studentName.trim();

                // 1. Provera praznih polja
                if (!trimmedName || !trimmedEmail || !trimmedStudent) {
                    alert('⚠️ Please fill in all details');
                    return;
                }

                // 2. Provera email validnosti
                if (!validateEmail(trimmedEmail)) {
                    alert('⚠️ Please enter a valid email address');
                    return;
                }

                // 3. Provera da li roditelj već ima termin sa ovim nastavnikom
                if (hasParentBookedTeacher(trimmedEmail, selectedTeacher.id)) {
                    alert('⚠️ You have already booked a meeting with this teacher.\n\nVeć ste zakazali sastanak sa ovim nastavnikom.');
                    return;
                }

                // 4. Provera da li je slot već zauzet - predloži sledeći
                if (isSlotBooked(selectedTeacher.id, timeSlot)) {
                    const validSlots = getValidSlotsForParent(trimmedEmail, selectedTeacher.id);
                    if (validSlots.length > 0) {
                        const nextSlot = validSlots[0];
                        const userChoice = window.confirm(
                            `⚠️ ${timeSlot} is already booked with ${selectedTeacher.name}.\n\n` +
                            `Would you like to book the next available slot at ${nextSlot} instead?\n\n` +
                            `Click OK to book ${nextSlot}, or Cancel to choose manually.`
                        );

                        if (userChoice) {
                            timeSlot = nextSlot;
                        } else {
                            return;
                        }
                    } else {
                        alert(`⚠️ ${selectedTeacher.name} has no available slots.`);
                        return;
                    }
                }

                // 5. Provera da li je roditelj zauzet u to vreme
                if (isParentBusy(trimmedEmail, timeSlot)) {
                    alert('⚠️ You already have a meeting at this time with another teacher');
                    return;
                }

                // 6. First booking suggestion
                const myBookings = bookings.filter(b => b.parentEmail === trimmedEmail);
                if (myBookings.length === 0) {
                    const earliestSlot = getEarliestAvailableSlot(selectedTeacher.id);

                    if (earliestSlot && timeSlot !== earliestSlot) {
                        const userChoice = window.confirm(
                            `💡 Suggestion: Starting at ${earliestSlot} helps everyone finish earlier!\n\n` +
                            `You selected ${timeSlot} with ${selectedTeacher.name}.\n\n` +
                            `Would you like to book ${earliestSlot} instead?\n\n` +
                            `Click OK to book ${earliestSlot}, or Cancel to continue with ${timeSlot}`
                        );

                        if (userChoice) {
                            timeSlot = earliestSlot;
                        }
                    }
                }

                // 7. PROVERA ZA GAP - SAMO UPOZORENJE, NE BLOKIRANJE!
                const parentSlots = bookings
                    .filter(b => b.parentEmail === trimmedEmail)
                    .map(b => timeSlots.indexOf(b.timeSlot))
                    .sort((a, b) => a - b);

                if (parentSlots.length > 0) {
                    const slotIndex = timeSlots.indexOf(timeSlot);
                    const minSlot = Math.min(...parentSlots);
                    const maxSlot = Math.max(...parentSlots);

                    const expandsStart = (slotIndex === minSlot - 1);
                    const expandsEnd = (slotIndex === maxSlot + 1);

                    let fillsGap = false;
                    for (let i = 1; i < parentSlots.length; i++) {
                        if (slotIndex > parentSlots[i - 1] && slotIndex < parentSlots[i]) {
                            fillsGap = true;
                            break;
                        }
                    }

                    // SAMO UPOZORI ako bi napravio rupu
                    if (!expandsStart && !expandsEnd && !fillsGap) {
                        const continueAnyway = window.confirm(
                            `⚠️ Warning: Booking ${timeSlot} will create a gap in your schedule.\n\n` +
                            `Your current bookings: ${parentSlots.map(i => timeSlots[i]).join(', ')}\n\n` +
                            `Are you sure you want to continue?`
                        );

                        if (!continueAnyway) {
                            return;
                        }
                    }
                }

                // 🚨 KRITIČNA FINALNA PROVERA - Pre čuvanja u Firebase
                // Ovo hvata race conditions i dupla bukiranja
                if (isSlotBooked(selectedTeacher.id, timeSlot)) {

                    return;

                    return;

                    bookedAt: new Date().toISOString(),
                };

                                                    for (let i = 1; i < parentSlots.length; i++) {

                                            <div>
                                                <span className="font-semibold text-gray-700">Time:</span>
                                                <span className="ml-2 text-gray-600">{ptmSettings.startTime} - {ptmSettings.endTime}</span>
                                            </div>
                                            <div>
                                                <span className="font-semibold text-gray-700">Slot Duration:</span>
                                                <span className="ml-2 text-gray-600">{ptmSettings.slotDuration} minutes</span>
                                            </div>
                                            <div>
                                                <span className="font-semibold text-gray-700">Total Slots:</span>
                                                <span className="ml-2 text-gray-600">{timeSlots.length} slots</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                {/* Teacher Management Card */}
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6 border-l-4 border-purple-500">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">👥 Manage Teachers</h3>
                                        <button
                                            onClick={() => {
                                                setManagingTeachers(!managingTeachers);
                                                if (managingTeachers) setSelectedYearForManagement(null);
                                            }}
                                            className="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 font-medium"
                                        >
                                            {managingTeachers ? 'Close' : 'Manage Teachers'}
                                        </button>
                                    </div>

                                    {managingTeachers && (
                                        <div>
                                            {!selectedYearForManagement ? (
                                                <div>
                                                    <p className="text-gray-600 mb-4">Select a year group:</p>
                                                    <div className="grid grid-cols-3 gap-3">
                                                        {yearGroups.map(year => (
                                                            <button
                                                                key={year.id}
                                                                onClick={() => setSelectedYearForManagement(year.id)}
                                                                className="bg-purple-100 text-purple-800 px-4 py-3 rounded-lg hover:bg-purple-200 font-medium"
                                                            >
                                                                {year.name} ({getTeachersForYear(year.id).length} teachers)
                                                            </button>
                                                        ))}
                                                    </div>

                                                    <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                                                        <p className="font-semibold mb-2">📋 All Teachers ({allTeachers.length})</p>
                                                        <div className="grid grid-cols-1 gap-2 max-h-96 overflow-y-auto">
                                                            {allTeachers.map(t => {
                                                                const assignedYears = Object.keys(yearTeacherAssignments).filter(
                                                                    year => yearTeacherAssignments[year].includes(t.id)
                                                                );
                                                                const hasBookings = bookings.some(b => b.teacherId === t.id);

                                                                return (
                                                                    <div key={t.id} className="flex justify-between items-center bg-white p-3 rounded-lg shadow-sm">
                                                                        <div className="flex-1">
                                                                            <span className="font-medium block">{t.name}</span>
                                                                            <span className="text-gray-600 text-xs block">{t.subject}</span>
                                                                            <span className="text-gray-500 text-xs block mt-1">
                                                                                {assignedYears.length > 0
                                                                                    ? `Assigned to: ${assignedYears.join(', ')}`
                                                                                    : 'Not assigned to any year'}
                                                                            </span>
                                                                            {hasBookings && (
                                                                                <span className="text-orange-600 text-xs block">
                                                                                    ⚠️ Has {bookings.filter(b => b.teacherId === t.id).length} booking(s)
                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                        <button
                                                                            onClick={() => deleteTeacherCompletely(t.id, t.name)}
                                                                            disabled={hasBookings}
                                                                            className={`px-3 py-1 rounded-lg text-xs font-medium ${hasBookings
                                                                                ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                                                                : 'bg-red-500 text-white hover:bg-red-600'
                                                                                }`}
                                                                            title={hasBookings ? 'Cannot delete - has bookings' : 'Delete teacher'}
                                                                        >
                                                                            🗑️ Delete
                                                                        </button>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div>
                                                    <button
                                                        onClick={() => setSelectedYearForManagement(null)}
                                                        className="mb-4 text-purple-600 hover:text-purple-800 font-medium"
                                                    >
                                                        ← Back
                                                    </button>

                                                    <h4 className="font-bold text-lg mb-3">
                                                        Teachers for {selectedYearForManagement} ({getTeachersForYear(selectedYearForManagement).length})
                                                    </h4>

                                                    {/* Add Existing Teacher */}
                                                    <div className="bg-purple-50 p-4 rounded-lg mb-4">
                                                        <p className="font-semibold mb-2">Add Teacher to {selectedYearForManagement}</p>
                                                        <div className="grid md:grid-cols-2 gap-3">
                                                            <select
                                                                value={teacherToAdd}
                                                                onChange={(e) => setTeacherToAdd(e.target.value)}
                                                                className="border-2 border-gray-300 rounded-lg px-3 py-2"
                                                            >
                                                                <option value="">-- Select Teacher --</option>
                                                                {allTeachers
                                                                    .filter(t => !yearTeacherAssignments[selectedYearForManagement].includes(t.id))
                                                                    .map(t => (
                                                                        <option key={t.id} value={t.id}>
                                                                            {t.name} - {t.subject}
                                                                        </option>
                                                                    ))}
                                                            </select>
                                                            <button
                                                                onClick={addTeacherToYear}
                                                                className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium"
                                                            >
                                                                ➕ Add to {selectedYearForManagement}
                                                            </button>
                                                        </div>

                                                        <button
                                                            onClick={() => setCreatingNewTeacher(!creatingNewTeacher)}
                                                            className="mt-3 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-sm"
                                                        >
                                                            {creatingNewTeacher ? 'Cancel' : '➕ Create New Teacher'}
                                                        </button>

                                                        {creatingNewTeacher && (
                                                            <div className="mt-3 p-3 bg-blue-50 rounded-lg">
                                                                <div className="grid grid-cols-2 gap-3 mb-2">
                                                                    <input
                                                                        type="text"
                                                                        placeholder="Teacher Name"
                                                                        value={newTeacherData.name}
                                                                        onChange={(e) => setNewTeacherData({ ...newTeacherData, name: e.target.value })}
                                                                        className="border-2 border-gray-300 rounded-lg px-3 py-2 text-sm"
                                                                    />
                                                                    <input
                                                                        type="text"
                                                                        placeholder="Subject"
                                                                        value={newTeacherData.subject}
                                                                        onChange={(e) => setNewTeacherData({ ...newTeacherData, subject: e.target.value })}
                                                                        className="border-2 border-gray-300 rounded-lg px-3 py-2 text-sm"
                                                                    />
                                                                </div>
                                                                <button
                                                                    onClick={createNewTeacher}
                                                                    className="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm w-full"
                                                                >
                                                                    ✅ Create & Add to {selectedYearForManagement}
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* Current Teachers */}
                                                    <div className="space-y-2">
                                                        {getTeachersForYear(selectedYearForManagement).map(teacher => (
                                                            <div key={teacher.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                                                                <div>
                                                                    <p className="font-semibold">{teacher.name}</p>
                                                                    <p className="text-sm text-gray-600">{teacher.subject}</p>
                                                                    <p className="text-xs text-gray-500">
                                                                        {bookings.filter(b => b.teacherId === teacher.id && b.yearGroup === selectedYearForManagement).length} bookings
                                                                    </p>
                                                                </div>
                                                                <button
                                                                    onClick={() => removeTeacherFromYear(teacher.id, teacher.name)}
                                                                    className="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 text-sm font-medium"
                                                                >
                                                                    🗑️ Remove
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div className="bg-yellow-50 border-2 border-yellow-400 rounded-lg p-4 mb-6">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-yellow-900">⚠️ Danger Zone</p>
                                            <p className="text-sm text-yellow-800 mt-1">This will permanently delete all bookings</p>
                                        </div>
                                        <button
                                            onClick={clearAllBookings}
                                            className="bg-green-600 text-white px-5 py-2.5 rounded-lg hover:bg-green-700 font-medium shadow-lg"
                                        >
                                            🗑️ Delete All Bookings
                                        </button>
                                        
                                    </div>
                                </div>

                                <h3 className="text-xl font-bold text-gray-800 mb-4">All Parent Bookings</h3>
                                <div className="grid md:grid-cols-2 gap-4">
                                    {Object.values(
                                        bookings.reduce((acc, b) => {
                                            if (!acc[b.parentEmail]) {
                                                acc[b.parentEmail] = {
                                                    parentName: b.parentName,
                                                    parentEmail: b.parentEmail,
                                                    studentName: b.studentName,
                                                    bookings: []
                                                };
                                            }
                                            acc[b.parentEmail].bookings.push(b);
                                            return acc;
                                        }, {})
                                    ).map(parent => (
                                        <div key={parent.parentEmail} className="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                                            <div className="mb-3">
                                                <div className="font-semibold text-lg text-gray-800">{parent.parentName}</div>
                                                <div className="text-sm text-gray-600">{parent.parentEmail}</div>
                                                <div className="text-sm text-gray-700 mt-1">Student: <span className="font-medium">{parent.studentName}</span></div>
                                                <div className="mt-2">
                                                    <span className="inline-block px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-medium">
                                                        {parent.bookings.length} {parent.bookings.length === 1 ? 'booking' : 'bookings'}
                                                    </span>
                                                </div>
                                            </div>

                                            {parent.bookings
                                                .sort((a, b) => a.timeSlot.localeCompare(b.timeSlot))
                                                .map(b => {
                                                    const endTime = new Date(`2025-01-23T${b.timeSlot}`);
                                                    endTime.setMinutes(endTime.getMinutes() + SLOT_DURATION);
                                                    const endStr = endTime.toTimeString().substring(0, 5);
                                                    return (
                                                        <div key={b.id} className="border-l-4 border-green-400 pl-3 py-1.5 mb-2 bg-green-50 rounded text-sm">
                                                            <span className="font-medium">{b.teacherName}</span> ({b.yearGroup}) - {b.timeSlot} - {endStr}
                                                        </div>
                                                    );
                                                })}

                                            <button
                                                onClick={() => generateParentPDF(parent.parentEmail)}
                                                className="mt-3 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 w-full font-medium shadow-md"
                                            >
                                                📄 Download PDF Schedule
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer className="text-center text-gray-600 text-sm mt-8 mb-4">
                        <p>Made with ❤️ by Milica Petkovic</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PTMBookingSystem />);

    </script>
</body>

</html>
